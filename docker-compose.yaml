services:
    db:
        image: postgres:14.3
        restart: always
        ports:
            - "5432:5432"
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        container_name: ErrorMonitorPlatform
        volumes:
            - ./postgres:/var/lib/postgresql/data
      # ── BACKEND (nuevo) ───────────────────────────────────────────
    backend:
        build: .
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            DB_HOST: ${DB_HOST}
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            - db
        restart: unless-stopped