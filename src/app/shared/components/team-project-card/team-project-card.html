<p-card [styleClass]="'h-full flex flex-col relative overflow-hidden transition-all duration-300 hover:shadow-xl hover:-translate-y-1'">
  <div class="flex flex-col h-full gap-4">
    <!-- Header: Project Info -->
    <div class="flex flex-row justify-between items-start border-b border-surface-200 dark:border-surface-700 pb-3">
        <div>
           <div class="text-xl font-bold text-surface-900 dark:text-surface-0">{{ teamGroup().teamName }}</div>
        </div>
    </div>

    <!-- Team Members List -->
    <div class="grow flex flex-col gap-3 mt-2">
        <h4 class="text-sm font-semibold text-surface-600 dark:text-surface-300 mb-1">Team Members</h4>
        
        @if (teamGroup().members.length === 0) {
            <div class="text-center p-4 text-surface-400 dark:text-surface-500 text-sm italic border border-dashed border-surface-200 dark:border-surface-700 rounded">
                No active team members.
            </div>
        }
        
        @for (membership of teamGroup().members; track membership.id) {
            <div class="flex flex-row items-center justify-between p-3 rounded bg-surface-0 dark:bg-surface-900 border border-surface-200 dark:border-surface-700 shadow-sm transition-colors hover:bg-surface-50 dark:hover:bg-surface-800">
                <div class="flex flex-col">
                    <span class="font-medium text-surface-900 dark:text-surface-0">{{ membership.user.name }}</span>
                    <div class="flex gap-2 items-center">
                        <span class="text-xs text-surface-500">{{ membership.user.email }}</span>
                        <p-tag [severity]="membership.role.isActive ? 'success' : 'warn'" [value]="membership.role.name" />
                    </div>
                </div>
                <p-button 
                    icon="pi pi-trash" 
                    severity="danger" 
                    [text]="true" 
                    [rounded]="true"
                    ariaLabel="Remove member"
                    [disabled]="isLoading()"
                    (onClick)="removeMember(membership.id)" />
            </div>
        }
    </div>
  </div>
</p-card>
