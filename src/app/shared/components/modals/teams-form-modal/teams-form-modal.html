<div class="fixed inset-0 z-50 flex items-center justify-center
            bg-black/50 backdrop-blur-sm p-4 animate-in fade-in duration-200"
     (click)="close()">
  <div class="max-w-md w-full bg-white dark:bg-slate-900
              border border-slate-200 dark:border-slate-800/60
              rounded-2xl overflow-hidden shadow-2xl
              animate-in zoom-in-95 duration-200"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800/60
                flex items-center justify-between
                bg-slate-50/50 dark:bg-slate-800/30">
      <h2 class="text-sm font-bold text-slate-900 dark:text-white">
        @if (isEdit()) { Edit team } @else { New team }
      </h2>
      <button (click)="close()"
        class="w-8 h-8 rounded-lg flex items-center justify-center
               text-slate-400 hover:text-slate-600 dark:hover:text-slate-200
               hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <lucide-icon name="x" [size]="16" />
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" class="px-5 py-6 space-y-4">
      <!-- Name -->
      <div>
        <label class="block text-[11px] font-semibold uppercase tracking-wide
                      text-slate-500 dark:text-slate-400 mb-1.5">
          Team name
        </label>
        <input type="text" formControlName="name"
          placeholder="e.g. Frontend Platform"
          class="w-full px-3 py-2.5 rounded-xl text-sm
                 bg-slate-50 dark:bg-slate-800/60
                 border border-slate-200 dark:border-slate-700/60
                 text-slate-900 dark:text-white
                 placeholder:text-slate-400 dark:placeholder:text-slate-500
                 focus:outline-none focus:border-indigo-500
                 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
        @if (form.get('name')?.touched && form.get('name')?.invalid) {
          <p class="text-xs text-red-500 dark:text-red-400 mt-1.5">
            Team name is required (2–255 characters)
          </p>
        }
      </div>

      <!-- Owner (read-only) -->
      @if (!isEdit()) {
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wide
                        text-slate-500 dark:text-slate-400 mb-1.5">
            Owner
          </label>
          <div class="flex items-center gap-2 px-3 py-2.5 rounded-xl
                      bg-slate-100 dark:bg-slate-800/40
                      border border-slate-200 dark:border-slate-700/40
                      opacity-70 cursor-not-allowed">
            <div class="w-5 h-5 rounded-full bg-indigo-100 dark:bg-indigo-500/20
                        flex items-center justify-center
                        text-indigo-600 dark:text-indigo-400
                        text-[9px] font-bold shrink-0">
              {{ settingsStore.initials() }}
            </div>
            <span class="text-xs text-slate-500 dark:text-slate-400">
              Assigned to you automatically
            </span>
          </div>
        </div>
      }
    </form>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-slate-200 dark:border-slate-800/60
                flex justify-end gap-2 bg-slate-50/50 dark:bg-slate-800/30">
      <button type="button" (click)="close()"
        class="px-4 py-2 rounded-xl text-sm font-semibold
               bg-white dark:bg-slate-800
               border border-slate-200 dark:border-slate-700
               text-slate-700 dark:text-slate-300
               hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
        Cancel
      </button>
      <button type="button" (click)="submit()"
        [disabled]="form.invalid || isSaving()"
        class="px-4 py-2 rounded-xl text-sm font-semibold
               bg-indigo-500 hover:bg-indigo-600 text-white
               transition-colors disabled:opacity-50
               disabled:cursor-not-allowed min-w-[120px]
               flex items-center justify-center gap-2">
        @if (isSaving()) {
          <lucide-icon name="refresh-cw" [size]="14" class="animate-spin" />
          Saving...
        } @else if (isEdit()) {
          Save changes
        } @else {
          Create team
        }
      </button>
    </div>
  </div>
</div>
