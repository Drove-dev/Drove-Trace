<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-in fade-in duration-200"
     (click)="close()">
  <!-- Stop propagation to prevent closing when clicking inside the modal -->
  <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800/60 rounded-2xl overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="px-5 py-4 border-b border-slate-200 dark:border-slate-800/60 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/30">
      <h2 class="text-base font-bold text-slate-900 dark:text-white">
        @if (isEdit()) { Edit project } @else { New project }
      </h2>
      <button (click)="close()"
              class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <lucide-icon name="x" [size]="16" />
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="px-5 py-6 space-y-4">
      <!-- Name Field -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1.5">
          Project name
        </label>
        <input
          type="text"
          formControlName="name"
          placeholder="e.g. Angular Error Monitor"
          class="w-full px-3 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 transition-all"
        />
        @if (form.get('name')?.touched && form.get('name')?.invalid) {
          <p class="text-xs text-red-500 dark:text-red-400 mt-1.5">
            Name is required (min 2 characters)
          </p>
        }
      </div>

      <!-- Team Field -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1.5">
          Team
        </label>
        <div class="relative">
          <select
            formControlName="teamId"
            class="w-full px-3 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 appearance-none cursor-pointer transition-all"
          >
            <option value="" disabled>Select a team</option>
            @for (team of teams(); track team.id) {
              <option [value]="team.id">{{ team.name }}</option>
            }
          </select>
          <lucide-icon name="chevron-right" [size]="14" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 rotate-90 pointer-events-none" />
        </div>
        @if (teams().length === 0) {
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-1.5">No teams available</p>
        }
        @if (form.get('teamId')?.touched && form.get('teamId')?.invalid) {
          <p class="text-xs text-red-500 dark:text-red-400 mt-1.5">Team is required</p>
        }
      </div>

      <!-- Environment Field -->
      <div>
        <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide mb-1.5">
          Environment
        </label>
        <div class="relative">
          <select
            formControlName="environment"
            class="w-full px-3 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 appearance-none cursor-pointer transition-all"
          >
            <option value="production">Production</option>
            <option value="staging">Staging</option>
            <option value="dev">Development</option>
          </select>
          <lucide-icon name="chevron-right" [size]="14" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 rotate-90 pointer-events-none" />
        </div>
      </div>

      <button type="submit" class="hidden"></button>
    </form>

    <!-- Footer -->
    <div class="px-5 py-4 border-t border-slate-200 dark:border-slate-800/60 flex justify-end gap-2 bg-slate-50/50 dark:bg-slate-800/30">
      <button type="button"
              (click)="close()"
              class="px-4 py-2 rounded-xl text-sm font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
        Cancel
      </button>
      <button type="submit"
              (click)="submit()"
              [disabled]="form.invalid || isSaving()"
              class="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-500 hover:bg-indigo-600 text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed min-w-[120px]">
        @if (isSaving()) {
          <span class="flex items-center gap-2">
            <lucide-icon name="refresh-cw" [size]="14" class="animate-spin" />
            Saving...
          </span>
        } @else if (isEdit()) {
          Save changes
        } @else {
          Create project
        }
      </button>
    </div>
  </div>
</div>
