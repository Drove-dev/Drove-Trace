<p-dialog
  [header]="data()?.id ? 'Edit User' : 'New User'"
  [(visible)]="visible"
  (onHide)="close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  maskStyleClass="backdrop-blur-sm"
  styleClass="border-none overflow-hidden rounded-xl shadow-2xl"
  [style]="{ width: '30rem', background: 'var(--bg-surface)' }"
  [breakpoints]="{ '575px': '90vw' }"
>
  <div class="flex flex-col gap-5 py-4">

    <div class="form-group !mb-0">
      <label class="label">Full Name</label>
      <input
        type="text"
        [formField]="userForm.name"
        placeholder="Ej. Juan Pérez"
        class="input"
        [class.input-error]="userForm.name().touched() && userForm.name().invalid()"
        [class.opacity-50]="store.isLoading()"
      />
      @if (userForm.name().touched() && userForm.name().invalid()) {
        <span class="field-error font-medium italic">
          {{ userForm.name().errors()[0]?.message }}
        </span>
      }
    </div>

    <div class="form-group !mb-0">
      <label class="label">Email Address</label>
      <input
        type="email"
        [value]="userModel().email"
        readonly
        class="input border-dashed !bg-[var(--bg-surface-2)] cursor-not-allowed opacity-70"
      />
      <span class="text-[10px] text-[var(--text-muted)] mt-1">
        Identifiers cannot be modified for security reasons.
      </span>
    </div>

    @if (store.isLoading() && isSaving()) {
      <div class="flex items-center gap-2 text-sm text-[var(--ring)] animate-pulse">
        <lucide-angular name="loader-pinwheel" [size]="16" class="animate-spin" />
        <span class="font-medium">{{ store.statusMessage() }}</span>
      </div>
    }
  </div>

  <ng-template #footer>
    <div class="flex items-center justify-end gap-3 p-4 border-t border-[var(--border)]">
      <button
        type="button"
        (click)="close()"
        [disabled]="store.isLoading()"
        class="btn-secondary !py-2"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="save()"
        [disabled]="store.isLoading() || userForm().invalid()"
        class="btn-primary min-w-[140px]"
      >
        @if (store.isLoading() && isSaving()) {
          <div class="spinner border-2 border-white/30 border-t-white rounded-full"></div>
          <span>Saving...</span>
        } @else {
          <lucide-angular name="save" [size]="18" />
          <span>Save Changes</span>
        }
      </button>
    </div>
  </ng-template>
</p-dialog>
