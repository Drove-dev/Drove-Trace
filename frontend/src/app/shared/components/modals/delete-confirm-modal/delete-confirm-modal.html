<p-dialog
  [header]="title()"
  [(visible)]="visible"
  (onHide)="cancel()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  maskStyleClass="backdrop-blur-sm"
  styleClass="border-none overflow-hidden rounded-xl shadow-2xl"
  [style]="{ width: '28rem', background: 'var(--bg-surface)' }"
  [breakpoints]="{ '575px': '90vw' }"
>
  <div class="flex flex-col gap-4 py-4">
    <div class="flex items-start gap-4">
      <div class="flex-shrink-0 w-10 h-10 bg-red-50 dark:bg-red-500/10 rounded-full flex items-center justify-center text-red-600 dark:text-red-400">
        <lucide-angular name="triangle-alert" [size]="20" />
      </div>
      <div class="flex flex-col gap-1">
        <h3 class="text-base font-semibold text-[var(--text-primary)]">
          Are you sure?
        </h3>
        <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
          {{ message() }}
        </p>
      </div>
    </div>
  </div>

  <ng-template #footer>
    <div class="flex items-center justify-end gap-3 p-4 border-t border-[var(--border)]">
      <button
        type="button"
        (click)="cancel()"
        [disabled]="isLoading()"
        class="px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300
               hover:bg-gray-50 dark:hover:bg-slate-800
               rounded-lg transition-colors disabled:opacity-30"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="confirm()"
        [disabled]="isLoading()"
        class="min-w-[110px] flex items-center justify-center gap-2
               bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium
               shadow-sm transition-all hover:bg-red-700
               disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (isLoading()) {
          <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span>Deleting...</span>
        } @else {
          <lucide-angular name="trash-2" [size]="16" />
          <span>Delete</span>
        }
      </button>
    </div>
  </ng-template>
</p-dialog>
