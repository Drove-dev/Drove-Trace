<div class="animate-in fade-in slide-in-from-bottom-6 duration-1000 p-3 space-y-6">

  <!-- Header + Error + Topbar -->
  <app-page-header
    title="Projects"
    subtitle="Manage your monitored applications."
    [error]="projectsStore.error()"
    searchPlaceholder="Search projects..."
    [viewMode]="viewMode()"
    actionLabel="New project"
    (searchEvent)="projectsStore.search($event)"
    (viewModeChange)="viewMode.set($event)"
    (actionEvent)="openCreate()"
  />

  <!-- Loading skeletons (removed - handled by components) -->

  <!-- ─── GRID VIEW ─────────────────────────────────────────────────────────── -->
  @if (viewMode() === 'grid') {
    <app-data-grid-view
      [items]="projectsStore.projects()"
      [isLoading]="projectsStore.isLoading()"
      [cardConfig]="{
        titleKey: 'name',
        subtitleKey: 'teamName',
        environmentKey: 'environment',
        dateKey: 'createdAt',
        icon: 'home'
      }"
      [currentPage]="projectsStore.currentPage()"
      [totalPages]="projectsStore.totalPages()"
      [totalItems]="projectsStore.totalItems()"
      [hasPrevPage]="projectsStore.hasPrevPage()"
      [hasNextPage]="projectsStore.hasNextPage()"
      [deletingId]="deletingId()"
      emptyMessage="No projects found"
      itemLabel="projects"
      (pageChange)="projectsStore.goToPage($event)"
      (onEdit)="editingProject.set($event); showFormModal.set(true)"
      (onDelete)="requestDelete($event)"
    />
  }

  <!-- ─── LIST VIEW ─────────────────────────────────────────────────────────── -->
  @if (viewMode() === 'list') {
    <app-data-list-view
      [items]="projectsStore.projects()"
      [isLoading]="projectsStore.isLoading()"
      [columns]="[
        { key: 'name', label: 'Project',     width: '1fr',   type: 'mono' },
        { key: 'teamName', label: 'Team',    width: '130px', type: 'badge' },
        { key: 'environment', label: 'Environment', width: '120px', type: 'env' },
        { key: 'createdAt', label: 'Created', width: '110px', type: 'date' }
      ]"
      [currentPage]="projectsStore.currentPage()"
      [totalPages]="projectsStore.totalPages()"
      [totalItems]="projectsStore.totalItems()"
      [hasPrevPage]="projectsStore.hasPrevPage()"
      [hasNextPage]="projectsStore.hasNextPage()"
      [deletingId]="deletingId()"
      emptyMessage="No projects found"
      itemLabel="projects"
      (pageChange)="projectsStore.goToPage($event)"
      (onEdit)="editingProject.set($event); showFormModal.set(true)"
      (onDelete)="requestDelete($event)"
    />
  }

  <!-- Modal -->
  @if (showFormModal()) {
    <app-project-form-modal
      [project]="editingProject()"
      [visible]="showFormModal()"
      (closed)="closeModal()"
      (saved)="closeModal()"
    />
  }
  <!-- Confirm delete modal -->
  @if (showConfirmModal()) {
    <app-delete-confirm-modal
      title="Delete Project"
      message="This will permanently remove the project from the system. This action cannot be undone."
      [isLoading]="!!deletingId()"
      (confirmed)="onConfirmDelete()"
      (cancelled)="onCancelDelete()"
    />
  }
</div>
