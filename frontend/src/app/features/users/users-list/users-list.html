<div class="animate-in fade-in slide-in-from-bottom-6 duration-1000 p-3 space-y-6">

  <!-- Header + Error + Topbar -->
  <app-page-header
    title="Users"
    subtitle="Manage your platform users."
    [error]="usersStore.error()"
    searchPlaceholder="Search users..."
    [viewMode]="viewMode()"
    actionLabel="New user"
    (searchEvent)="usersStore.search($event)"
    (viewModeChange)="viewMode.set($event)"
    (actionEvent)="openCreate()"
  />

  <!-- ─── GRID VIEW ─────────────────────────────────────────────────────────── -->
  @if (viewMode() === 'grid') {
    <app-data-grid-view
      [items]="usersStore.users()"
      [isLoading]="usersStore.isLoading()"
      [cardConfig]="{
        titleKey: 'name',
        subtitleKey: 'email',
        dateKey: 'createdAt',
        icon: 'user'
      }"
      [currentPage]="usersStore.currentPage()"
      [totalPages]="usersStore.totalPages()"
      [totalItems]="usersStore.totalItems()"
      [hasPrevPage]="usersStore.hasPrevPage()"
      [hasNextPage]="usersStore.hasNextPage()"
      [deletingId]="deletingId()"
      emptyMessage="No users found"
      itemLabel="users"
      (pageChange)="usersStore.goToPage($event)"
      (onEdit)="editingUser.set($event); showFormModal.set(true)"
      (onDelete)="requestDelete($event)"
    />
  }

  <!-- ─── LIST VIEW ─────────────────────────────────────────────────────────── -->
  @if (viewMode() === 'list') {
    <app-data-list-view
      [items]="usersStore.users()"
      [isLoading]="usersStore.isLoading()"
      [columns]="[
        { key: 'name', label: 'Name', width: '1fr', type: 'mono' },
        { key: 'email', label: 'Email', width: '200px', type: 'text' },
        { key: 'createdAt', label: 'Created', width: '130px', type: 'date' }
      ]"
      [currentPage]="usersStore.currentPage()"
      [totalPages]="usersStore.totalPages()"
      [totalItems]="usersStore.totalItems()"
      [hasPrevPage]="usersStore.hasPrevPage()"
      [hasNextPage]="usersStore.hasNextPage()"
      [deletingId]="deletingId()"
      emptyMessage="No users found"
      itemLabel="users"
      (pageChange)="usersStore.goToPage($event)"
      (onEdit)="editingUser.set($event); showFormModal.set(true)"
      (onDelete)="requestDelete($event)"
    />
  }

  <!-- Modal -->
  @if (showFormModal()) {
    <app-users-form-modal
      [user]="editingUser()"
      [visible]="showFormModal()"
      (closed)="closeModal()"
      (saved)="closeModal()"
    />
  }
  <!-- Confirm delete modal -->
  @if (showConfirmModal()) {
    <app-delete-confirm-modal
      title="Delete User"
      message="This will permanently remove the user from the system. This action cannot be undone."
      [isLoading]="!!deletingId()"
      (confirmed)="onConfirmDelete()"
      (cancelled)="onCancelDelete()"
    />
  }
</div>
