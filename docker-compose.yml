name: errly-platform

services:
  db:
    image: postgres:14.3
    container_name: errly-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-errly_db}
    volumes:
      - errly_postgres_data:/var/lib/postgresql/data
    networks:
      - errly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-errly_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: errly-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db 
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - errly-network
    command: sh -c "npm run seed:generate && npm run start:dev"

  frontend:
    container_name: errly-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - errly-network
    command: npm run start -- --host 0.0.0.0

networks:
  errly-network:
    driver: bridge

volumes:
  errly_postgres_data: